<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="대한민국에서 열리는 팝업스토어를 지도에서 찾아보세요." />
  <meta name="theme-color" content="#ff5c35" />
  <title>팝업맵 KR | 지금 열리는 팝업 찾기</title>
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />
  <style>
    :root {
      --orange: #ff5c35;
      --orange-dark: #de3f1c;
      --orange-soft: #fff0eb;
      --ink: #202020;
      --muted: #737373;
      --line: #e8e5e1;
      --surface: #ffffff;
      --canvas: #f7f5f2;
      --green: #16855b;
      --blue: #3d66d6;
      --shadow: 0 18px 48px rgba(38, 27, 18, 0.14);
      color-scheme: light;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: var(--canvas);
      color: var(--ink);
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button, a { -webkit-tap-highlight-color: transparent; }
    button { color: inherit; }

    .app-shell { height: 100%; display: grid; grid-template-rows: 68px minmax(0, 1fr); }
    .topbar {
      z-index: 1100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 0 22px;
      border-bottom: 1px solid rgba(32,32,32,.08);
      background: rgba(255,255,255,.93);
      backdrop-filter: blur(18px);
    }
    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .brand-mark {
      display: grid; place-items: center;
      width: 38px; height: 38px;
      border-radius: 13px 13px 13px 4px;
      background: var(--orange);
      color: #fff;
      font-weight: 900;
      box-shadow: 0 8px 18px rgba(255,92,53,.3);
    }
    .brand-copy { min-width: 0; }
    .brand-title { font-size: 17px; line-height: 1.1; font-weight: 850; letter-spacing: -.04em; }
    .brand-subtitle { margin-top: 3px; color: var(--muted); font-size: 11px; white-space: nowrap; }
    .topbar-meta { display: flex; align-items: center; gap: 8px; }
    .update-badge {
      max-width: 260px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      color: var(--muted); font-size: 12px;
    }
    .header-link {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 36px; padding: 0 12px;
      border: 1px solid var(--line); border-radius: 11px;
      background: #fff; color: var(--ink); text-decoration: none;
      font-size: 12px; font-weight: 750;
    }
    .header-link:hover { border-color: #bbb5ad; background: #faf9f7; }

    .workspace { position: relative; display: grid; grid-template-columns: 390px minmax(0, 1fr); min-height: 0; }
    .sidebar {
      z-index: 800;
      display: flex; flex-direction: column; min-height: 0;
      border-right: 1px solid var(--line); background: var(--surface);
    }
    .sidebar-scroll { padding: 18px 18px 14px; overflow-y: auto; }
    .search-wrap { position: relative; }
    .search-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: #8b8782; pointer-events: none; }
    .search-input {
      width: 100%; height: 46px; padding: 0 42px 0 42px;
      border: 1px solid var(--line); border-radius: 14px; outline: 0;
      background: var(--canvas); color: var(--ink); font-size: 14px;
      transition: .2s ease;
    }
    .search-input:focus { border-color: var(--orange); background: #fff; box-shadow: 0 0 0 4px var(--orange-soft); }
    .clear-search {
      position: absolute; right: 8px; top: 7px;
      width: 32px; height: 32px; border: 0; border-radius: 10px;
      background: transparent; color: var(--muted); cursor: pointer;
    }
    .clear-search[hidden] { display: none; }

    .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .summary-card { padding: 11px 10px; border-radius: 13px; background: var(--canvas); }
    .summary-label { color: var(--muted); font-size: 10px; font-weight: 700; }
    .summary-value { margin-top: 2px; font-size: 20px; line-height: 1; font-weight: 880; letter-spacing: -.04em; }
    .summary-value.open { color: var(--green); }
    .summary-value.upcoming { color: var(--blue); }

    .filter-section { margin-top: 18px; }
    .filter-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
    .filter-title { margin: 0; font-size: 12px; font-weight: 800; }
    .reset-button { border: 0; background: transparent; color: var(--orange-dark); font-size: 11px; font-weight: 750; cursor: pointer; }
    .chip-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .filter-chip {
      min-height: 32px; padding: 6px 11px;
      border: 1px solid var(--line); border-radius: 999px;
      background: #fff; color: #5d5954; font-size: 11px; font-weight: 720; cursor: pointer;
    }
    .filter-chip:hover { border-color: #c9c3bb; }
    .filter-chip.active { border-color: var(--ink); background: var(--ink); color: #fff; }
    .filter-chip.status-open.active { border-color: var(--green); background: var(--green); }
    .filter-chip.status-upcoming.active { border-color: var(--blue); background: var(--blue); }

    .list-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line);
    }
    .result-count { font-size: 13px; font-weight: 850; }
    .map-only-label { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 11px; cursor: pointer; }
    .map-only-label input { accent-color: var(--orange); }
    .popup-list { display: grid; gap: 10px; margin-top: 10px; padding-bottom: 24px; }
    .popup-card {
      display: grid; grid-template-columns: 76px minmax(0, 1fr); gap: 12px;
      width: 100%; padding: 9px;
      border: 1px solid var(--line); border-radius: 16px;
      background: #fff; text-align: left; cursor: pointer;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
    }
    .popup-card:hover, .popup-card.active { transform: translateY(-1px); border-color: #d0c7bf; box-shadow: 0 10px 26px rgba(42,31,24,.09); }
    .card-image { width: 76px; height: 76px; object-fit: cover; border-radius: 12px; background: linear-gradient(135deg,#ffd6c7,#fff0d8); }
    .card-image-fallback { display: grid; place-items: center; font-size: 23px; font-weight: 900; color: var(--orange-dark); }
    .card-body { min-width: 0; padding: 2px 2px 1px 0; }
    .card-badges { display: flex; align-items: center; gap: 5px; margin-bottom: 5px; }
    .status-badge, .confidence-badge, .category-badge {
      display: inline-flex; align-items: center; min-height: 20px; padding: 3px 7px;
      border-radius: 999px; font-size: 9px; line-height: 1; font-weight: 820;
    }
    .status-badge.open { background: #e7f6ef; color: var(--green); }
    .status-badge.upcoming { background: #edf1ff; color: var(--blue); }
    .status-badge.ended { background: #f1f1f1; color: #777; }
    .confidence-badge { background: var(--orange-soft); color: var(--orange-dark); }
    .category-badge { background: #f0eeeb; color: #69635d; }
    .card-title { margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 820; letter-spacing: -.02em; }
    .card-place, .card-date { margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 10px; }
    .empty-state { padding: 38px 20px; border: 1px dashed #d8d2cb; border-radius: 16px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.7; }

    .map-wrap { position: relative; min-width: 0; min-height: 0; }
    #map { position: absolute; inset: 0; background: #eae7e1; }
    .leaflet-control-attribution { font-size: 9px !important; }
    .leaflet-bar { border: 0 !important; box-shadow: 0 8px 26px rgba(37,28,22,.16) !important; }
    .leaflet-bar a { border: 0 !important; color: var(--ink) !important; }
    .leaflet-popup-content-wrapper { border-radius: 14px; box-shadow: var(--shadow); }
    .leaflet-popup-content { margin: 12px 14px; }
    .marker-cluster-small, .marker-cluster-medium, .marker-cluster-large { background: rgba(255,92,53,.23); }
    .marker-cluster-small div, .marker-cluster-medium div, .marker-cluster-large div { background: var(--orange); color: #fff; font-weight: 850; }
    .popup-pin-wrap { background: transparent; border: 0; }
    .popup-pin {
      display: grid; place-items: center;
      width: 34px; height: 34px;
      border: 3px solid #fff; border-radius: 50% 50% 50% 15%;
      background: var(--orange); color: #fff;
      box-shadow: 0 6px 18px rgba(50,37,29,.28);
      transform: rotate(-45deg);
    }
    .popup-pin span { transform: rotate(45deg); font-size: 11px; font-weight: 900; }
    .popup-pin.upcoming { background: var(--blue); }
    .popup-pin.ended { background: #8c8985; }

    .map-toolbar { position: absolute; z-index: 600; top: 16px; right: 16px; display: grid; gap: 8px; }
    .map-button {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      min-width: 42px; height: 42px; padding: 0 12px;
      border: 1px solid rgba(32,32,32,.08); border-radius: 13px;
      background: rgba(255,255,255,.95); box-shadow: 0 8px 24px rgba(42,31,24,.13);
      cursor: pointer; font-size: 11px; font-weight: 780;
    }
    .map-button:hover { background: #fff; }
    .mobile-filter-button { display: none; }
    .map-legend {
      position: absolute; z-index: 600; right: 16px; bottom: 22px;
      display: flex; align-items: center; gap: 10px;
      padding: 9px 11px; border: 1px solid rgba(32,32,32,.08); border-radius: 12px;
      background: rgba(255,255,255,.94); box-shadow: 0 8px 24px rgba(42,31,24,.12);
      color: var(--muted); font-size: 10px;
    }
    .legend-item { display: flex; align-items: center; gap: 5px; }
    .legend-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); }
    .legend-dot.upcoming { background: var(--blue); }

    .detail-panel {
      position: absolute; z-index: 900; top: 14px; right: 14px; bottom: 14px;
      width: min(390px, calc(100vw - 32px));
      overflow-y: auto; border: 1px solid rgba(32,32,32,.08); border-radius: 22px;
      background: #fff; box-shadow: var(--shadow);
      transform: translateX(calc(100% + 34px)); opacity: 0; pointer-events: none;
      transition: transform .24s ease, opacity .2s ease;
    }
    .detail-panel.open { transform: translateX(0); opacity: 1; pointer-events: auto; }
    .detail-close {
      position: sticky; z-index: 2; top: 12px; float: right; margin: 12px 12px -54px 0;
      width: 38px; height: 38px; border: 0; border-radius: 50%;
      background: rgba(255,255,255,.92); box-shadow: 0 5px 18px rgba(0,0,0,.15); cursor: pointer;
    }
    .detail-hero { width: 100%; aspect-ratio: 16/10; object-fit: cover; border-radius: 21px 21px 0 0; background: linear-gradient(135deg,#ffceb9,#fff2d8); }
    .detail-content { padding: 20px; }
    .detail-eyebrow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 11px; }
    .detail-title { margin: 0; font-size: 24px; line-height: 1.25; letter-spacing: -.045em; }
    .detail-info { display: grid; gap: 12px; margin: 20px 0; }
    .detail-row { display: grid; grid-template-columns: 24px minmax(0,1fr); gap: 9px; align-items: start; }
    .detail-icon { color: var(--orange); font-weight: 900; }
    .detail-label { color: var(--muted); font-size: 10px; font-weight: 750; }
    .detail-value { margin-top: 3px; font-size: 13px; line-height: 1.55; }
    .confidence-box { padding: 14px; border-radius: 14px; background: var(--canvas); }
    .confidence-line { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 780; }
    .confidence-track { height: 6px; margin-top: 9px; overflow: hidden; border-radius: 99px; background: #e4e0db; }
    .confidence-fill { height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--orange),#ffa050); }
    .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
    .detail-action {
      display: inline-flex; justify-content: center; align-items: center;
      min-height: 43px; padding: 0 10px; border-radius: 12px;
      border: 1px solid var(--line); background: #fff; color: var(--ink); text-decoration: none;
      font-size: 12px; font-weight: 800;
    }
    .detail-action.primary { border-color: var(--orange); background: var(--orange); color: #fff; }
    .detail-source { margin-top: 12px; color: var(--muted); font-size: 10px; line-height: 1.5; }

    .loading {
      position: fixed; z-index: 2000; inset: 0; display: grid; place-items: center;
      background: var(--canvas); transition: opacity .25s ease;
    }
    .loading.done { opacity: 0; pointer-events: none; }
    .loading-card { text-align: center; }
    .loading-logo { margin: 0 auto 14px; width: 52px; height: 52px; border-radius: 18px 18px 18px 5px; display: grid; place-items: center; background: var(--orange); color: #fff; font-size: 20px; font-weight: 900; animation: pulse 1.4s ease infinite; }
    .loading-text { color: var(--muted); font-size: 13px; }
    @keyframes pulse { 50% { transform: scale(.92); opacity: .82; } }

    @media (max-width: 820px) {
      .app-shell { grid-template-rows: 58px minmax(0,1fr); }
      .topbar { padding: 0 13px; }
      .brand-mark { width: 34px; height: 34px; border-radius: 11px 11px 11px 4px; }
      .brand-title { font-size: 15px; }
      .brand-subtitle, .update-badge, .header-link.api-link { display: none; }
      .header-link { height: 33px; padding: 0 10px; }
      .workspace { display: block; }
      .map-wrap { position: absolute; inset: 0; }
      .sidebar {
        position: absolute; z-index: 850; left: 10px; right: 10px; bottom: 10px;
        max-height: 54%; border: 1px solid rgba(32,32,32,.08); border-radius: 22px;
        box-shadow: var(--shadow); transform: translateY(calc(100% + 20px));
        transition: transform .25s ease;
      }
      .sidebar.open { transform: translateY(0); }
      .sidebar-scroll { padding: 14px; }
      .summary-grid { display: none; }
      .filter-section { margin-top: 14px; }
      .popup-list { grid-template-columns: 1fr; }
      .map-toolbar { top: 12px; right: 10px; }
      .mobile-filter-button { display: inline-flex; background: var(--ink); color: #fff; }
      .map-legend { left: 10px; right: auto; bottom: 12px; }
      .detail-panel { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 86%; transform: translateY(calc(100% + 20px)); }
      .detail-panel.open { transform: translateY(0); }
    }

    @media (max-width: 430px) {
      .popup-card { grid-template-columns: 68px minmax(0,1fr); }
      .card-image { width: 68px; height: 68px; }
      .map-button span { display: none; }
      .map-button { width: 42px; min-width: 42px; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <div class="loading-card"><div class="loading-logo">P</div><div class="loading-text">팝업 지도를 준비하고 있어요</div></div>
  </div>

  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">P</div>
        <div class="brand-copy">
          <div class="brand-title">팝업맵 KR</div>
          <div class="brand-subtitle">지금 열리는 팝업을 한눈에</div>
        </div>
      </div>
      <div class="topbar-meta">
        <span class="update-badge" id="updatedAt">데이터 불러오는 중</span>
        <a class="header-link api-link" href="./openapi.yaml" target="_blank" rel="noreferrer">API 명세</a>
        <a class="header-link" href="https://github.com/shynewsky/popup-map-kr" target="_blank" rel="noreferrer">GitHub</a>
      </div>
    </header>

    <main class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="팝업 검색과 필터">
        <div class="sidebar-scroll">
          <div class="search-wrap">
            <span class="search-icon">⌕</span>
            <input class="search-input" id="searchInput" type="search" placeholder="팝업, 브랜드, 장소 검색" autocomplete="off" />
            <button class="clear-search" id="clearSearch" aria-label="검색어 지우기" hidden>×</button>
          </div>

          <div class="summary-grid">
            <div class="summary-card"><div class="summary-label">전체</div><div class="summary-value" id="totalCount">0</div></div>
            <div class="summary-card"><div class="summary-label">운영 중</div><div class="summary-value open" id="openCount">0</div></div>
            <div class="summary-card"><div class="summary-label">오픈 예정</div><div class="summary-value upcoming" id="upcomingCount">0</div></div>
          </div>

          <section class="filter-section">
            <div class="filter-head"><h2 class="filter-title">상태</h2><button class="reset-button" id="resetFilters">초기화</button></div>
            <div class="chip-row" id="statusFilters"></div>
          </section>
          <section class="filter-section">
            <div class="filter-head"><h2 class="filter-title">카테고리</h2></div>
            <div class="chip-row" id="categoryFilters"></div>
          </section>
          <section class="filter-section">
            <div class="filter-head"><h2 class="filter-title">지역</h2></div>
            <div class="chip-row" id="regionFilters"></div>
          </section>

          <div class="list-head">
            <div class="result-count" id="resultCount">0개의 팝업</div>
            <label class="map-only-label"><input type="checkbox" id="mapOnly" /> 현재 지도만</label>
          </div>
          <div class="popup-list" id="popupList"></div>
        </div>
      </aside>

      <section class="map-wrap" aria-label="팝업 지도">
        <div id="map"></div>
        <div class="map-toolbar">
          <button class="map-button mobile-filter-button" id="mobileFilterButton" aria-label="필터와 목록 열기">☰ <span>목록</span></button>
          <button class="map-button" id="fitButton" aria-label="검색 결과 전체 보기">⌗ <span>전체 보기</span></button>
          <button class="map-button" id="locateButton" aria-label="내 위치 보기">◎ <span>내 위치</span></button>
        </div>
        <div class="map-legend">
          <span class="legend-item"><span class="legend-dot"></span>운영 중</span>
          <span class="legend-item"><span class="legend-dot upcoming"></span>오픈 예정</span>
        </div>
        <aside class="detail-panel" id="detailPanel" aria-label="팝업 상세 정보"></aside>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script>
    const API_URL = './api/v1/popups.json';
    const state = {
      items: [], filtered: [], selectedId: null, query: '', mapOnly: false,
      statuses: new Set(['open', 'upcoming']), categories: new Set(), regions: new Set()
    };
    const markerById = new Map();
    const el = id => document.getElementById(id);
    const map = L.map('map', { zoomControl: false, minZoom: 6, maxZoom: 19 }).setView([36.25, 127.9], 7);
    L.control.zoom({ position: 'bottomright' }).addTo(map);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);
    const markers = L.markerClusterGroup({
      showCoverageOnHover: false, maxClusterRadius: 48, spiderfyOnMaxZoom: true,
      iconCreateFunction(cluster) {
        const count = cluster.getChildCount();
        return L.divIcon({ html: `<div><span>${count}</span></div>`, className: `marker-cluster marker-cluster-${count < 10 ? 'small' : count < 40 ? 'medium' : 'large'}`, iconSize: L.point(40, 40) });
      }
    }).addTo(map);

    function seoulToday() {
      const parts = new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit' }).formatToParts(new Date());
      const o = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return `${o.year}-${o.month}-${o.day}`;
    }
    function statusOf(item) {
      const today = seoulToday();
      if (today < item.period.start) return 'upcoming';
      if (today > item.period.end) return 'ended';
      return 'open';
    }
    function statusLabel(status) { return ({ open: '운영 중', upcoming: '오픈 예정', ended: '종료' })[status] || status; }
    function formatDate(value) {
      const [y,m,d] = value.split('-'); return `${y}.${m}.${d}`;
    }
    function formatPeriod(item) { return `${formatDate(item.period.start)} - ${formatDate(item.period.end)}`; }
    function escapeHtml(value = '') { return String(value).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])); }
    function confidenceLabel(item) {
      if (item.verificationStatus === 'source_confirmed') return '출처 확인';
      if (item.verificationStatus === 'manually_verified') return '직접 확인';
      return '자동 수집';
    }
    function imageMarkup(item, cls = 'card-image') {
      if (!item.imageUrl) return `<div class="${cls} card-image-fallback">P</div>`;
      return `<img class="${cls}" src="${escapeHtml(item.imageUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.outerHTML='<div class=\'${cls} card-image-fallback\'>P</div>'" />`;
    }
    function pinIcon(status) {
      return L.divIcon({ className: 'popup-pin-wrap', html: `<div class="popup-pin ${status}"><span>P</span></div>`, iconSize: [34,34], iconAnchor: [17,32] });
    }

    function buildFilters() {
      const statuses = [['open','운영 중'],['upcoming','오픈 예정'],['ended','종료']];
      el('statusFilters').innerHTML = statuses.map(([v,l]) => `<button class="filter-chip status-${v} ${state.statuses.has(v) ? 'active' : ''}" data-filter="status" data-value="${v}">${l}</button>`).join('');
      const categories = [...new Set(state.items.map(x => x.category))].sort((a,b) => a.localeCompare(b,'ko'));
      el('categoryFilters').innerHTML = categories.map(v => `<button class="filter-chip ${state.categories.has(v) ? 'active' : ''}" data-filter="category" data-value="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('');
      const preferred = ['서울','경기','인천','부산','대구','대전','광주','울산','세종','강원','충북','충남','전북','전남','경북','경남','제주'];
      const regions = [...new Set(state.items.map(x => x.region))].sort((a,b) => preferred.indexOf(a)-preferred.indexOf(b));
      el('regionFilters').innerHTML = regions.map(v => `<button class="filter-chip ${state.regions.has(v) ? 'active' : ''}" data-filter="region" data-value="${escapeHtml(v)}">${escapeHtml(v)}</button>`).join('');
      document.querySelectorAll('[data-filter]').forEach(button => button.addEventListener('click', () => {
        const type = button.dataset.filter, value = button.dataset.value;
        const set = type === 'status' ? state.statuses : type === 'category' ? state.categories : state.regions;
        set.has(value) ? set.delete(value) : set.add(value);
        buildFilters(); render();
      }));
    }

    function matches(item) {
      const status = statusOf(item);
      if (!state.statuses.has(status)) return false;
      if (state.categories.size && !state.categories.has(item.category)) return false;
      if (state.regions.size && !state.regions.has(item.region)) return false;
      if (state.query) {
        const haystack = [item.title,item.brandName,item.category,item.region,item.venue.name,item.venue.address].filter(Boolean).join(' ').toLowerCase();
        if (!haystack.includes(state.query.toLowerCase())) return false;
      }
      if (state.mapOnly && !map.getBounds().contains([item.venue.latitude,item.venue.longitude])) return false;
      return true;
    }

    function render() {
      state.filtered = state.items.filter(matches).sort((a,b) => {
        const weight = { open: 0, upcoming: 1, ended: 2 };
        return weight[statusOf(a)] - weight[statusOf(b)] || a.period.start.localeCompare(b.period.start) || a.title.localeCompare(b.title,'ko');
      });
      el('resultCount').textContent = `${state.filtered.length.toLocaleString()}개의 팝업`;
      const allOpen = state.items.filter(x => statusOf(x)==='open').length;
      const allUpcoming = state.items.filter(x => statusOf(x)==='upcoming').length;
      el('totalCount').textContent = state.items.length.toLocaleString();
      el('openCount').textContent = allOpen.toLocaleString();
      el('upcomingCount').textContent = allUpcoming.toLocaleString();
      renderList(); renderMarkers();
    }

    function renderList() {
      if (!state.filtered.length) {
        el('popupList').innerHTML = '<div class="empty-state">조건에 맞는 팝업이 없어요.<br>필터를 바꾸거나 지도를 이동해 보세요.</div>';
        return;
      }
      el('popupList').innerHTML = state.filtered.map(item => {
        const status = statusOf(item);
        return `<button class="popup-card ${state.selectedId===item.id?'active':''}" data-id="${item.id}">
          ${imageMarkup(item)}
          <span class="card-body">
            <span class="card-badges"><span class="status-badge ${status}">${statusLabel(status)}</span><span class="confidence-badge">${confidenceLabel(item)}</span></span>
            <span class="card-title">${escapeHtml(item.title)}</span>
            <span class="card-place">${escapeHtml(item.venue.name)} · ${escapeHtml(item.region)}</span>
            <span class="card-date">${formatPeriod(item)}</span>
          </span>
        </button>`;
      }).join('');
      document.querySelectorAll('.popup-card').forEach(card => card.addEventListener('click', () => selectItem(card.dataset.id, true)));
    }

    function renderMarkers() {
      markers.clearLayers(); markerById.clear();
      state.filtered.forEach(item => {
        const status = statusOf(item);
        const marker = L.marker([item.venue.latitude,item.venue.longitude], { icon: pinIcon(status), title: item.title });
        marker.bindTooltip(`<strong>${escapeHtml(item.title)}</strong><br><span>${escapeHtml(item.venue.name)}</span>`, { direction: 'top', offset: [0,-24] });
        marker.on('click', () => selectItem(item.id, false));
        markerById.set(item.id, marker); markers.addLayer(marker);
      });
    }

    function selectItem(id, moveMap) {
      const item = state.items.find(x => x.id === id); if (!item) return;
      state.selectedId = id; showDetail(item); renderList();
      if (moveMap) {
        map.setView([item.venue.latitude,item.venue.longitude], Math.max(map.getZoom(), 15), { animate: true });
        const marker = markerById.get(id); if (marker) setTimeout(() => marker.openTooltip(), 250);
      }
      el('sidebar').classList.remove('open');
    }

    function showDetail(item) {
      const status = statusOf(item);
      const address = item.venue.address;
      const naver = `https://map.naver.com/p/search/${encodeURIComponent(address)}`;
      const kakao = `https://map.kakao.com/link/search/${encodeURIComponent(address)}`;
      const sources = Array.isArray(item.sources) && item.sources.length ? item.sources : [item.source];
      const sourceLinks = sources.map((source, index) => `<a class="detail-action" href="${escapeHtml(source.url)}" target="_blank" rel="noreferrer" style="grid-column:1/-1">${sources.length > 1 ? `원문 ${index + 1} 확인하기` : '원문에서 확인하기'}</a>`).join('');
      el('detailPanel').innerHTML = `
        <button class="detail-close" id="detailClose" aria-label="상세 닫기">×</button>
        ${imageMarkup(item,'detail-hero')}
        <div class="detail-content">
          <div class="detail-eyebrow"><span class="status-badge ${status}">${statusLabel(status)}</span><span class="category-badge">${escapeHtml(item.category)}</span><span class="confidence-badge">${confidenceLabel(item)}</span></div>
          <h2 class="detail-title">${escapeHtml(item.title)}</h2>
          <div class="detail-info">
            <div class="detail-row"><div class="detail-icon">◷</div><div><div class="detail-label">운영 기간</div><div class="detail-value">${formatPeriod(item)}</div></div></div>
            <div class="detail-row"><div class="detail-icon">●</div><div><div class="detail-label">장소</div><div class="detail-value"><strong>${escapeHtml(item.venue.name)}</strong><br>${escapeHtml(address)}</div></div></div>
            <div class="detail-row"><div class="detail-icon">↗</div><div><div class="detail-label">데이터 출처</div><div class="detail-value">${escapeHtml(item.source.name)} · ${escapeHtml(item.verificationStatus)}${sources.length > 1 ? ` · 원문 ${sources.length}개 병합` : ''}</div></div></div>
          </div>
          <div class="confidence-box"><div class="confidence-line"><span>데이터 신뢰도</span><strong>${Math.round(item.confidence*100)}%</strong></div><div class="confidence-track"><div class="confidence-fill" style="width:${Math.round(item.confidence*100)}%"></div></div></div>
          <div class="detail-actions"><a class="detail-action primary" href="${naver}" target="_blank" rel="noreferrer">네이버지도</a><a class="detail-action" href="${kakao}" target="_blank" rel="noreferrer">카카오맵</a>${sourceLinks}</div>
          <div class="detail-source">최종 확인 ${new Date(item.lastVerifiedAt).toLocaleString('ko-KR')} · 자동 수집 데이터는 방문 전 원문을 확인해 주세요.</div>
        </div>`;
      el('detailPanel').classList.add('open');
      el('detailClose').addEventListener('click', closeDetail);
    }
    function closeDetail() { state.selectedId = null; el('detailPanel').classList.remove('open'); renderList(); }

    function fitResults() {
      if (!state.filtered.length) return;
      const bounds = L.latLngBounds(state.filtered.map(x => [x.venue.latitude,x.venue.longitude]));
      map.fitBounds(bounds, { padding: [40,40], maxZoom: 13 });
    }

    el('searchInput').addEventListener('input', e => { state.query=e.target.value.trim(); el('clearSearch').hidden=!state.query; render(); });
    el('clearSearch').addEventListener('click', () => { el('searchInput').value=''; state.query=''; el('clearSearch').hidden=true; render(); });
    el('mapOnly').addEventListener('change', e => { state.mapOnly=e.target.checked; render(); });
    el('resetFilters').addEventListener('click', () => { state.statuses=new Set(['open','upcoming']); state.categories.clear(); state.regions.clear(); state.query=''; state.mapOnly=false; el('searchInput').value=''; el('mapOnly').checked=false; el('clearSearch').hidden=true; buildFilters(); render(); });
    el('fitButton').addEventListener('click', fitResults);
    el('mobileFilterButton').addEventListener('click', () => el('sidebar').classList.toggle('open'));
    el('locateButton').addEventListener('click', () => map.locate({ setView:true, maxZoom:14 }));
    map.on('moveend', () => { if(state.mapOnly) render(); });
    map.on('locationfound', e => L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#202020',fillOpacity:1}).addTo(map).bindTooltip('내 위치').openTooltip());
    map.on('locationerror', () => alert('현재 위치를 확인할 수 없습니다. 브라우저 위치 권한을 확인해 주세요.'));
    document.addEventListener('keydown', e => { if(e.key==='Escape'){closeDetail(); el('sidebar').classList.remove('open');} });

    fetch(API_URL, { cache: 'no-store' }).then(r => {
      if (!r.ok) throw new Error(`API ${r.status}`); return r.json();
    }).then(data => {
      state.items = data.items || [];
      const merged = Number(data.deduplication?.mergedRecords || 0);
      el('updatedAt').textContent = `업데이트 ${new Date(data.generatedAt).toLocaleString('ko-KR')}${merged ? ` · 중복 ${merged}건 병합` : ''}`;
      buildFilters(); render(); fitResults();
    }).catch(error => {
      console.error(error);
      el('popupList').innerHTML = '<div class="empty-state">팝업 데이터를 불러오지 못했습니다.<br>잠시 뒤 다시 시도해 주세요.</div>';
      el('updatedAt').textContent = '데이터 연결 오류';
    }).finally(() => setTimeout(() => el('loading').classList.add('done'), 280));
  </script>
</body>
</html>
