name: Refresh popup data

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-popup-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public popup feed
        run: node scripts/refresh-dayforyou.mjs
      - name: Validate refreshed data
        run: node scripts/validate-data.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- api/v1/popups.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "popup-map-kr bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/v1/popups.json
          git commit -m "data: refresh popup feed"
          git push
