name: Refresh popup data

on:
  schedule:
    - cron: '17 20 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh public popup feed
        run: node scripts/refresh-dayforyou.mjs
      - name: Validate refreshed data
        run: node scripts/validate-data.mjs
      - name: Commit changes
        run: |
          if git diff --quiet -- api/v1/popups.json; then
            echo "No data changes"
            exit 0
          fi
          git config user.name "popup-map-kr bot"
          git config user.email "actions@users.noreply.github.com"
          git add api/v1/popups.json
          git commit -m "data: refresh popup feed"
          git push

  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
