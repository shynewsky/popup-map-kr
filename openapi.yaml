openapi: 3.1.0
info:
  title: Popup Map KR Static API
  version: 1.0.0
  description: |
    대한민국 팝업스토어 지도에서 사용하는 읽기 전용 정적 JSON API입니다.
    현재 버전은 GitHub Pages에서 JSON 전체를 내려주며 검색과 필터는 클라이언트에서 처리합니다.
servers:
  - url: https://shynewsky.github.io/popup-map-kr
paths:
  /api/v1/popups.json:
    get:
      summary: 팝업 목록 조회
      operationId: listPopups
      responses:
        '200':
          description: 수집·중복 제거된 팝업 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PopupDataset'
components:
  schemas:
    PopupDataset:
      type: object
      required: [apiVersion, generatedAt, window, sourceSummary, items]
      properties:
        apiVersion:
          type: string
          const: v1
        generatedAt:
          type: string
          format: date-time
        window:
          $ref: '#/components/schemas/CollectionWindow'
        license:
          type: string
        deduplication:
          $ref: '#/components/schemas/Deduplication'
        sourceSummary:
          type: array
          items:
            $ref: '#/components/schemas/SourceSummary'
        items:
          type: array
          items:
            $ref: '#/components/schemas/Popup'
    CollectionWindow:
      type: object
      required: [start, end, timeZone, selection]
      properties:
        start: { type: string, format: date, description: 다음 주 월요일 }
        end: { type: string, format: date, description: 다음 주 일요일 }
        timeZone: { type: string, const: Asia/Seoul }
        selection: { type: string }
    SourceSummary:
      type: object
      required: [name, type, url, records]
      properties:
        name: { type: string }
        type: { type: string }
        url: { type: string, format: uri }
        records: { type: integer, minimum: 0 }
        rawRecords: { type: integer, minimum: 0 }
        duplicateCandidatesMerged: { type: integer, minimum: 0 }
    Deduplication:
      type: object
      required: [mergedRecords, strategy]
      properties:
        mergedRecords: { type: integer, minimum: 0 }
        strategy: { type: string }
    Popup:
      type: object
      required: [id, title, category, region, venue, period, verificationStatus, confidence, source, sources, lastVerifiedAt]
      properties:
        id: { type: string }
        title: { type: string }
        brandName: { type: [string, 'null'] }
        category: { type: string }
        region: { type: string }
        venue:
          $ref: '#/components/schemas/Venue'
        period:
          $ref: '#/components/schemas/Period'
        verificationStatus:
          type: string
          enum: [candidate, auto_parsed, source_confirmed, manually_verified]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        imageUrl:
          type: [string, 'null']
          format: uri
        source:
          $ref: '#/components/schemas/Source'
        sources:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/Source'
        firstSeenAt: { type: string, format: date-time }
        lastVerifiedAt: { type: string, format: date-time }
    Venue:
      type: object
      required: [name, address, latitude, longitude]
      properties:
        name: { type: string }
        address: { type: string }
        latitude: { type: number, minimum: 32, maximum: 39.5 }
        longitude: { type: number, minimum: 124, maximum: 132.5 }
    Period:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date }
        end: { type: string, format: date }
    Source:
      type: object
      required: [name, type, url]
      properties:
        name: { type: string }
        type: { type: string }
        url: { type: string, format: uri }
